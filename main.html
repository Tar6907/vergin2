<!DOCTYPE html>
<html>
<head>
  <title>Signature</title>
  <style>
    /* Ensure consistent table spacing */
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 480px;
    }
    /* Adjust padding for the text section */
    td {
      padding: 0;
      margin: 0;
    }
    /* Reduce the width of the vertical line separator */
    .separator {
      width: 10px; /* Reduced width for less space */
    }
    /* Styling for the text block */
    .text-block {
      font-family: 'Abril Fatface', sans-serif;
      font-size: 18px;
      color: #132b3c;
    }
    .position {
      font-size: 12px;
      color: #c79f3e;
    }
    /* Margin adjustments for the icons */
    .social-icons img {
      width: 28px;
      height: 24px;
      margin-right: 5px;
    }
    .social-icons a {
      text-decoration: none;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <td width="156">
        <img src="https://i.postimg.cc/vBKy6Hpd/Untitled-design.png" width="156" height="130" alt="Logo">
      </td>
      <td class="separator">
        <img src="https://i.postimg.cc/rwp7kLd6/super-thick-vertical-line.png" width="4" height="100" alt="Separator">
      </td>
      <td class="text-block">
        <i>Tarmin Jacobs</i><br>
        <span class="position"><i>Co-Chief Executive Officer</i></span><br>
        <div class="social-icons" style="margin-top: 5px;">
            <a href="https://www.facebook.com/vermontverginsa/" target="_blank">
             <img src="http://madebysimplifi.co.za/vergin_sa/_facebook.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/vergin_sa/" target="_blank">
              <img src="http://madebysimplifi.co.za/vergin_sa/_instagram.png" alt="Instagram">
             </a>
              <a href="https://verginsa.co.za/" target="_blank">
                <img src="https://i.postimg.cc/vBKy6Hpd/Untitled-design.png" alt="Vermont VerGin">
              </a>
          </div>
      </td>
    </tr>
  </table>
</body>
</html>
